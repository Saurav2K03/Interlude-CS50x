{% extends "layout.html" %}

{% block title %}
    Register / Log In
{% endblock %}

{% block main %}
    <div class="login-page">
        <div class="glassy app-name">
            <span id="inter">INTER</span><span id="lude">LUDE.</span>
        </div>
        <!-- <div class="medium greeting">
            Welcome,
            <div class="small">
                may you have a great time!
            </div>
        </div> -->
        <div class="login-main">    
            <div class="register">
                Register
                <form action="/register" method="post">
                    <div class="field">
                        <label for="register_username">Username:</label>
                        <input id="register_username" autocomplete="off" name="username" type="text">
                    </div>
                    <div class="field">
                        <label for="register_password">Password:</label>
                        <input id="register_password" name="password" type="password">
                    </div>
                    <div class="field">
                        <label for="confirmation">Confirm Password:</label>
                        <input id="confirmation" name="confirmation" type="password">
                    </div>
                    <button class="glassy" type="submit">Let's Go!</button>
                    <div class="login-show">Already a user? <span class="login-show-btn">Login.</span></div>
                </form>
            </div>
        
            <div class="login">
                Login
                <form action="/login" method="post">
                    <div class="field">
                        <label for="login_username">Username:</label>
                        <input id="login_username" autocomplete="off" name="username" type="text">
                    </div>
                    <div class="field">
                        <label for="login_password">Password:</label>
                        <input id="login_password" name="password" type="password">
                    </div>
                    <div class="forgot">Forgot Password?</div>
                    <button class="glassy" type="submit">Let's Go!</button>
                    <div class="register-show">New user? <span class="register-show-btn">Register.</span></div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
